name: Données FranceAgriMer

on:
  schedule:
    # Chaque samedi à 6h UTC : FranceAgriMer publie les cotations de la semaine
    # écoulée entre le jeudi et le vendredi.
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donnees-franceagrimer
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Télécharger les nouveaux fichiers
        run: python scripts/fetch.py

      - name: Transformer les données
        run: python scripts/transform.py

      - name: Enregistrer s'il y a du nouveau
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée cette semaine."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Données FranceAgriMer du $(date -u +%Y-%m-%d)"
          git push
