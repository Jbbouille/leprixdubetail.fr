name: Site GitHub Pages

on:
  # Modification du site ou des données poussée à la main
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "data/processed/**"
      - ".github/workflows/site.yml"
  # Après chaque mise à jour automatique des données (un push fait par une action
  # ne déclenche pas d'autre workflow, d'où ce déclencheur)
  workflow_run:
    workflows: ["Données FranceAgriMer"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site et les données
        run: |
          mkdir -p site/data
          cp data/processed/*.json data/processed/*.csv site/data/

      - name: Versionner les fichiers (invalidation du cache navigateur)
        run: |
          version="${GITHUB_SHA::8}"
          sed -i "s/__VERSION__/${version}/g" site/*.html site/app.js site/sw.js
          ! grep -rl "__VERSION__" site/ || { echo "Marqueur __VERSION__ non remplacé"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
